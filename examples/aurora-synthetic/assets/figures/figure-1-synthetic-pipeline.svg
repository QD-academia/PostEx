<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Synthetic cohort generation and modelling pipeline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7FAFC"/><stop offset="1" stop-color="#EAF4F5"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0F5F73"/><stop offset="1" stop-color="#2C8C99"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102A43" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1200" height="720" rx="30" fill="url(#bg)"/>
  <text x="60" y="70" font-family="Arial" font-size="34" font-weight="700" fill="#102A43">Synthetic benchmark workflow</text>
  <text x="60" y="108" font-family="Arial" font-size="19" fill="#486581">All profiles, features and outcomes are authored simulation fixtures</text>
  <g stroke="#9FB3C8" stroke-width="5" fill="none"><path d="M272 354H354"/><path d="M548 354H630"/><path d="M824 354H906"/></g>
  <g fill="#E8B44C"><path d="M346 344l18 10-18 10z"/><path d="M622 344l18 10-18 10z"/><path d="M898 344l18 10-18 10z"/></g>
  <g transform="translate(60 202)" filter="url(#s)">
    <rect width="212" height="304" rx="22" fill="#FFFFFF" stroke="#D9E2EC"/>
    <circle cx="106" cy="82" r="43" fill="#E8B44C"/>
    <path d="M82 82h48M106 58v48" stroke="#102A43" stroke-width="7" stroke-linecap="round"/>
    <text x="106" y="154" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#102A43">Fixed seed</text>
    <text x="106" y="187" text-anchor="middle" font-family="Arial" font-size="18" fill="#486581">1,240 profiles</text>
    <text x="106" y="215" text-anchor="middle" font-family="Arial" font-size="18" fill="#486581">480 features</text>
    <text x="106" y="260" text-anchor="middle" font-family="Arial" font-size="17" fill="#0F5F73">Seed 20260808</text>
  </g>
  <g transform="translate(354 202)" filter="url(#s)">
    <rect width="194" height="304" rx="22" fill="#FFFFFF" stroke="#D9E2EC"/>
    <g transform="translate(44 38)">
      <g fill="#0F5F73"><rect width="22" height="22" rx="4"/><rect x="28" width="22" height="22" rx="4" opacity=".72"/><rect x="56" width="22" height="22" rx="4" opacity=".46"/><rect x="84" width="22" height="22" rx="4" opacity=".28"/></g>
      <g fill="#2C8C99"><rect y="28" width="22" height="22" rx="4" opacity=".42"/><rect x="28" y="28" width="22" height="22" rx="4"/><rect x="56" y="28" width="22" height="22" rx="4" opacity=".7"/><rect x="84" y="28" width="22" height="22" rx="4" opacity=".45"/></g>
      <g fill="#E8B44C"><rect y="56" width="22" height="22" rx="4" opacity=".34"/><rect x="28" y="56" width="22" height="22" rx="4" opacity=".55"/><rect x="56" y="56" width="22" height="22" rx="4"/><rect x="84" y="56" width="22" height="22" rx="4" opacity=".65"/></g>
    </g>
    <text x="97" y="154" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#102A43">Latent modules</text>
    <text x="97" y="187" text-anchor="middle" font-family="Arial" font-size="18" fill="#486581">3 anonymous axes</text>
    <text x="97" y="215" text-anchor="middle" font-family="Arial" font-size="18" fill="#486581">controlled censoring</text>
    <text x="97" y="260" text-anchor="middle" font-family="Arial" font-size="17" fill="#0F5F73">No gene mapping</text>
  </g>
  <g transform="translate(630 202)" filter="url(#s)">
    <rect width="194" height="304" rx="22" fill="#FFFFFF" stroke="#D9E2EC"/>
    <path d="M46 92c22-48 45 44 67-4s36 26 42-18" fill="none" stroke="url(#flow)" stroke-width="9" stroke-linecap="round"/>
    <circle cx="46" cy="92" r="7" fill="#E8B44C"/><circle cx="113" cy="88" r="7" fill="#E8B44C"/><circle cx="155" cy="70" r="7" fill="#E8B44C"/>
    <text x="97" y="154" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#102A43">Elastic net</text>
    <text x="97" y="187" text-anchor="middle" font-family="Arial" font-size="18" fill="#486581">480 to 12 features</text>
    <text x="97" y="215" text-anchor="middle" font-family="Arial" font-size="18" fill="#486581">nested resampling</text>
    <text x="97" y="260" text-anchor="middle" font-family="Arial" font-size="17" fill="#0F5F73">AURORA-12</text>
  </g>
  <g transform="translate(906 202)" filter="url(#s)">
    <rect width="234" height="304" rx="22" fill="#FFFFFF" stroke="#D9E2EC"/>
    <g transform="translate(35 45)" font-family="Arial" font-weight="700" text-anchor="middle"><circle cx="35" cy="35" r="31" fill="#0F5F73"/><circle cx="129" cy="35" r="31" fill="#2C8C99"/><circle cx="35" cy="111" r="31" fill="#E8B44C"/><circle cx="129" cy="111" r="31" fill="#486581"/><g fill="#fff" font-size="19"><text x="35" y="42">D</text><text x="129" y="42">I</text><text x="35" y="118">A</text><text x="129" y="118">B</text></g></g>
    <text x="117" y="222" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#102A43">Four cohorts</text>
    <text x="117" y="255" text-anchor="middle" font-family="Arial" font-size="18" fill="#486581">shift and stress tests</text>
  </g>
  <rect x="60" y="570" width="1080" height="86" rx="18" fill="#102A43"/>
  <text x="600" y="607" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#FFFFFF">Interpretation boundary</text>
  <text x="600" y="635" text-anchor="middle" font-family="Arial" font-size="17" fill="#D9E2EC">Methodological fixture only - no biological or clinical inference</text>
</svg>
