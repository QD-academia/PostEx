[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "postex"
version = "0.2.0a1"
description = "Evidence-linked Palette Fusion for distinctive academic posters"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "PostEx contributors" }]
keywords = ["academic-poster", "palette-fusion", "pptx", "bioinformatics", "observational-study"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["PyYAML>=6.0", "jsonschema>=4.22"]

[project.optional-dependencies]
openai = ["openai>=1.50"]
anthropic = ["anthropic>=0.40"]
render = ["Pillow>=10.4", "PyMuPDF>=1.24", "pypdf>=5.0"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
postex = "postex.cli:main"

[project.urls]
Documentation = "https://github.com/QD-academia/PostEx/tree/main/docs"
Issues = "https://github.com/QD-academia/PostEx/issues"
Source = "https://github.com/QD-academia/PostEx"

[tool.hatch.build.targets.wheel]
packages = ["src/postex"]

[tool.hatch.build.targets.wheel.force-include]
"assets/templates" = "postex/assets/templates"
"schemas" = "postex/schemas"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/assets/templates",
  "/schemas",
  "/configs",
  "/skills",
  "/examples",
  "/tests",
  "/evals",
  "/docs",
  "/docker",
  "/scripts",
  "/README.md",
  "/PRD.md",
  "/ARCHITECTURE.md",
  "/LICENSE",
  "/NOTICE",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["postex"]
