campaign:
  id: genshin-study-identity
  name: Genshin Study Identity
  product_line: Give every study its own visual identity.
  editorial_line: One paper. Seven regions. Seven visual identities.
  registry_version: 1
  updated_at: 2026-08-10

status_contract:
  allowed:
    - planned
    - rendering
    - review
    - ready
    - published
  ready_requires:
    - poster_png
    - editable_pptx
    - palette_reference
    - evidence_record
    - preflight_report
    - rights_review
    - human_visual_review
  published_requires:
    - channel_copy_review
    - links_verified
    - rights_notice_present

rights_boundary:
  unofficial: true
  affiliation_or_endorsement_implied: false
  character_art_in_generated_poster_default: false
  character_name_or_art_required_for_palette_use: false
  rule: >-
    Palette DNA may preserve named-theme provenance and original role-based color
    values. Character artwork, game logos, screenshots, fonts, and other protected
    media remain separate assets and may appear in promotional documentation only
    when the applicable rights record permits that exact use.
  public_notice: >-
    Genshin-inspired Palette DNA is an unofficial visual interpretation. Generated
    scientific posters do not embed character artwork by default, and no affiliation
    or endorsement is implied.
  references:
    - ../../assets/palettes/rights.yaml
    - ../licensing.md
    - ../images/showcase/README.md

identities:
  - identity_id: study-identity-001-paimon
    display_name: Paimon / Celestial Starlight
    region: cross-region
    status: ready
    route: named-theme-interpretation
    catalog_palette_id: null
    campaign_angle: A friendly celestial identity with a strong evidence hierarchy.
    suggested_domains:
      - bioinformatics
      - artificial-intelligence
      - general-science
    artifacts:
      poster_png: ../../examples/aurora-synthetic/output/paimon/aurora-synthetic-paimon-cape-gradient-visual-signature.png
      editable_pptx: ../../examples/aurora-synthetic/output/paimon/aurora-synthetic-paimon-cape-gradient-visual-signature.pptx
      palette_reference: ../../examples/palette-fusion/outputs/palette/palette-candidates.json
      evidence_record: ../../examples/aurora-synthetic/evidence.json
      preflight_report: ../../examples/aurora-synthetic/output/paimon/preflight-report.json
      rights_review: ../../examples/aurora-synthetic/ASSET_LICENSES.md

