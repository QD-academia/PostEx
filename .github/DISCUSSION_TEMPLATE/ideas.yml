title: "[Idea] "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: Share a focused idea for PostEx. Explain the user problem before proposing the interface.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should PostEx do?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Examples or evidence
      description: Screenshots, workflows, public links, or related tools are welcome.
