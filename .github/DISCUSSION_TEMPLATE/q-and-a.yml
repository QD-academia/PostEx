title: "[Question] "
labels: ["question"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installation and golden demo
        - Palette DNA
        - Conference Intelligence
        - Evidence and Trusted Export
        - PPTX, PDF, or PNG rendering
        - Contribution workflow
        - Other
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Include the outcome you want and what you have already tried. Remove private research data and secrets.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PostEx version or commit
      placeholder: 0.5.0a1
  - type: textarea
    id: context
    attributes:
      label: Relevant output
      description: Paste a short sanitized error or link to a public example. Use an Issue for confirmed reproducible bugs.
